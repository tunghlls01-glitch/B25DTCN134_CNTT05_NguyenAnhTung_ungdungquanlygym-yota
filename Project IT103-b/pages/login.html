<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../style/login.css">
</head>

<body>
    <div class="login">
        <header class="header">
            <h1>Đăng nhập</h1>
        </header>
        <main class="main">
            <div class="divEmail">
                <span>Email</span><br>
                <input type="email" class="loginEmail"><br>
            </div>  
            <div class="divPassword">
                <span>Mật khẩu</span><br>
                <input type="password" class="loginPassword"><br>
            </div>
            <button class="buttonLogin">Đăng nhập</button><br>
        </main>
        <footer class="footer">
            <p>Chưa có tài khoản?</p>
            <a href="http://127.0.0.1:5500/pages/register.html">Đăng ký ngay</a>
        </footer>
    </div>
<script src="../js/login.js"></script>
</body>

</html>
