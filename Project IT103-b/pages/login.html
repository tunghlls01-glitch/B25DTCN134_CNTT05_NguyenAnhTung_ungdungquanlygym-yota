<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="../style/login.css">
</head>

<body>
    <div class="login">
        <header class="header">
            <h1>Đăng nhập</h1>
        </header>
        <main class="main">
            <div class="divEmail">
                <span>Email</span><br>
                <input type="email" id="loginEmail"><br>
            </div>  
            <div class="divPassword">
                <span>Mật khẩu</span><br>
                <input type="password" id="loginPassword"><br>
            </div>
            <p class="error_login" id="error_login"></p>
            <button class="buttonLogin" onclick="login()">Đăng nhập</button><br>
        </main>
        <footer class="footer">
            <p>Chưa có tài khoản?</p>
            <a href="http://127.0.0.1:5500/pages/register.html">Đăng ký ngay</a>
        </footer>
        <div class="status" id="status">
            <div class="card_success" >
                <span>✅ đăng nhập Thành công</span>
            </div> 
        </div>
    </div>
<script src="../js/login.js"></script>
</body>

</html>
