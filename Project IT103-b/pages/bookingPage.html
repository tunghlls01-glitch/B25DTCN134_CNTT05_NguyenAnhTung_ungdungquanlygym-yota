<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bookingPage</title>
    <link rel="stylesheet" href="../style/bookingPage.css">
</head>

<body>
    <header>
        <div class="div_header">
            <h1>GYM MANAGEMENT</h1>
            <div class="div_a">
                <a href="../pages/homePage.html">Trang chủ</a>
                <a href="../pages/bookingPage.html">Lịch tập</a>
            </div>
        </div>
    </header>
    <main>
        <div class="banner">
            <h1>Quản lý lịch tập</h1>
            <button onclick="renderForm()">Đặt lịch mới</button>
        </div>
        <table>
            <thead class="thead">
                <tr>
                    <th>Lớp học</th>
                    <th>Ngày tập</th>
                    <th>Khung giờ</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody class="tbody">
                <tr>
                    <td>GYM</td>
                    <td>2023-03-10</td>
                    <td>7:00 - 13:00</td>
                    <td>Nguyễn Anh Tùng</td>
                    <td>tunghlls01@gmail.com</td>
                    <td>
                        <button class="btnEdit">Sửa</button>
                        <button class="btnDelete">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
    <div class="formAdd" id="formAdd" style="display: block;">
        <div class="">
            <h1>Đặt lịch mới</h1>
        </div>
        <div class="classRooms">
            <label>Lớp học</label><br>
            <select>
                <option value="" disabled selected>Chọn lớp học</option>
                <option value="gym">Gym</option>
                <option value="yoga">Yoga</option>
                <option value="zumba">Zumba</option>
            </select>
        </div>
        <div class="addTime">
            <label for="time">Khung giờ</label><br>
            <select id="time">
                <option value="" disabled selected>Chọn khung giờ</option>
                <option value="7-9">07:00 - 09:00</option>
                <option value="9-11">09:00 - 11:00</option>
                <option value="13-15">13:00 - 15:00</option>
                <option value="17-19">17:00 - 19:00</option>
            </select>
        </div>
        <div class="btn">
            <button>Hủy</button>
            <button>Lưu</button>
        </div>
    </div>
</body>

</html>
