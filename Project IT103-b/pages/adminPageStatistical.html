<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adminPage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../style/adminPageStatistical.css">
</head>

<body>
    <div class="all">
        <div class="headerAdmin">
            <div class="main_h1">
                <h1>Admin Dashboard</h1>
            </div>
            <div class="main_a">
                <a href="../pages/adminPageStatistical.html" style="background-color: rgba(224, 220, 224, 0.296);">Quản
                    lý lịch</a>
                <a href="../pages/adminPageService.html">Quản lý dịch vụ</a>
                <a href="../pages/homePage.html">Trang chủ</a>
                <a href="../pages/login.html" style="color: #F87171;">Đăng xuất</a>
            </div>
        </div>
        <div class="mainAdmin">
            <h1>Thống kê lịch tập</h1>
            <!-- div1 -->
            <div class="total_all">
                <div class="total">
                    <h2>Tổng số lịch Gym</h2>
                    <p style="color: #2563EB;" id="total_Gym">0</p>
                </div>
                <div class="total">
                    <h2>Tổng số lịch Yoga</h2>
                    <p style="color: #059669;" id="total_Yoga">0</p>
                </div>
                <div class="total">
                    <h2>Tổng số lịch Zumba</h2>
                    <p style="color: #7C3AED;;" id="total_Zumba">0</p>
                </div>
            </div>
            <!-- div2 -->
            <div class="row-justify-content-centre mt -4">
                <!-- bảng thống kê -->
                <div class="col-10">
                    <div class="card">
                        <div class="card-body">
                            <canvas id="myChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <!-- div3 -->
            <div class="filter">
                <h2>Bộ lọc</h2>
                <div class="roomsFilter">
                    <div>
                        <label for="">Lớp học</label><br>
                        <select name="" id="">
                            <option value="">Tất cả</option>
                            <option value="">Gym</option>
                            <option value="">Yoga</option>
                            <option value="">Zumba</option>
                        </select>
                    </div>
                    <div>
                        <label for="">Email</label><br>
                        <input type="email" placeholder="Tìm theo email">
                    </div>
                    <div>
                        <label for="">Ngày</label><br>
                        <input type="date" placeholder="Tìm theo email">
                    </div>
                </div>
            </div>
            <!-- div4 -->
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>Lớp học</th>
                            <th>Ngày tập</th>
                            <th>Khung giờ</th>
                            <th>Họ tên</th>
                            <th>Email</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="tbody" id="tbody">
                        <!-- hiển thị tất cả lịch ở đây -->
                         <!-- <tr>
                            <td>Yoga</td>
                            <td>2025-05-02</td>
                            <td>14:00 - 16:00</td>
                            <td>Nguyễn Anh Tùng</td>
                            <td>tunghlls01@gmail.com</td>
                            <td>
                                <button class="btnEdit">Sửa</button>
                                <button class="btnDelete">Xóa</button>
                            </td>
                         </tr> -->
                    </tbody>
                </table>
            </div>
            <footer id="pagination">
            <!-- phân trang -->
            </footer>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="../js/adminPageStatistical.js"></script>
</body>
</html>
